name: Verify compile

# Proves ./compile.sh works against current Silverscript in a fresh container,
# daily and on every push — the same bar kasstacker.org holds everything to.
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: '0 8 * * *'

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/kaspanet/silverscript ../silverscript
      - run: ./compile.sh
      - run: |
          test -s artifact.json
          echo "artifact bytes: $(wc -c < artifact.json)"
